name: Soru
description: Ajandam'da bir şeyi nasıl yapacağını soruyorsun
labels: [soru]
body:
  - type: markdown
    attributes:
      value: |
        Lütfen kayıtlarındaki tutarları, adları ve hesap bilgilerini paylaşma; ekran görüntüsü eklersen bunları gizle.
  - type: textarea
    id: soru
    attributes:
      label: Sorun ne?
      description: Neyi yapmak istiyorsun, nerede takıldın?
    validations:
      required: true
  - type: input
    id: surum
    attributes:
      label: Ajandam ve işletim sistemi sürümü
      description: İsteğe bağlı. Ajandam'da Ayarlar › Hakkında; Mac mi, Windows mu, iPhone ya da iPad mi, Android mi?
      placeholder: "Ajandam 4.6.0 · macOS 27 (ya da Windows 11 24H2, iOS 27.1, Android 16)"
