name: Soru
description: Ajandam'da bir şeyi nasıl yapacağını soruyorsun
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Lütfen kayıtlarındaki tutarları, adları ve hesap bilgilerini paylaşma; ekran görüntüsü eklersen bunları gizle.
  - type: textarea
    id: soru
    attributes:
      label: Sorun ne?
      description: Neyi yapmak istiyorsun, nerede takıldın?
    validations:
      required: true
  - type: input
    id: surum
    attributes:
      label: Ajandam ve işletim sistemi sürümü
      description: İsteğe bağlı. Ajandam'da Ayarlar › Hakkında; Mac mi, Windows mu, iPhone mu, claude.ai mi?
      placeholder: "Ajandam 3.9.0 · macOS 26.0 (ya da Windows 11 24H2, iOS 26.0)"
