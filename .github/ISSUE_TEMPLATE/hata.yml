name: Hata bildir
description: Ajandam'da bir şey beklendiği gibi çalışmıyor
labels: [hata]
body:
  - type: markdown
    attributes:
      value: |
        Bildirdiğin için teşekkürler. Lütfen kayıtlarındaki tutarları, adları ve hesap bilgilerini paylaşma; ekran görüntüsü eklersen bunları gizle.
  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu?
      description: Ne yaptın, ne bekliyordun, ne oldu?
      placeholder: "Ekstreyi içe aktarırken… beklediğim… olan…"
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır?
      placeholder: |
        1. …
        2. …
  - type: dropdown
    id: platform
    attributes:
      label: Nerede kullanıyorsun?
      options:
        - Mac (Mac App Store'dan)
        - Mac (indirme sayfasından)
        - Windows (Microsoft Store'dan)
        - Windows (kurulum dosyasıyla)
        - iPhone ya da iPad
        - Android
        - claude.ai
    validations:
      required: true
  - type: input
    id: surum
    attributes:
      label: Ajandam sürümü
      description: Ayarlar › Hakkında
      placeholder: "4.6.0"
    validations:
      required: true
  - type: input
    id: cihaz
    attributes:
      label: Telefon ya da tablet
      description: "iPhone, iPad ya da Android'de kullanıyorsan: cihazın modeli ve sistem sürümü (iPhone ve iPad'de Ayarlar › Genel › Hakkında, Android'de Ayarlar › Telefon hakkında)"
      placeholder: "iPhone 17, iOS 27.1 ya da Galaxy S25, Android 16"
  - type: input
    id: macos
    attributes:
      label: macOS sürümü
      description: "Mac'te kullanıyorsan: Apple menüsü › Bu Mac Hakkında"
      placeholder: "macOS 27"
  - type: input
    id: windows
    attributes:
      label: Windows sürümü
      description: "Windows'ta kullanıyorsan: Windows tuşu + R, winver yaz, Enter"
      placeholder: "Windows 11 24H2 (26100.4061)"
